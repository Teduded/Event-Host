<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="icon" href="../icons/eventFavicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div id="header">EVENTSIDA</div>
        <div class="nav-item"><a href="home.html">Home</a></div>
        <div class="nav-item"><a href="about.html">About</a></div>
        <div class="nav-item"><a href="contacts.html">Contact</a></div>
    </nav>

    <div class="hero">
        <img class="hero-image" src="../images/home-hero.jpg" alt="Hero Image" loading="lazy">
        <h1 class="title">CONTACTS</h1>
        <h1 class="subtitle">We offer 24/7 support online</h1>
    </div>

    <div class="content-row">

        <!-- Ruta för information -->

        <div class="info-box">
            <h2>Help with your event:</h2>
            <p>Email: muthialah.eventsida@gmail.com</p>
            <h2>Contact us:</h2>
            <p>Phone: 070-420-69-67</p>
            <p>Address: Eventgatan 67, Stockholm</p>
        </div>

        <!-- Ruta för kontakt ruta -->

        <div class="info-box" style="flex: 1.5; max-width: 500px;">
            <h2>Send a message</h2>
            <form class="contact-form" onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" required placeholder="What is this about?">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" required placeholder="Write your message here..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </div>

    <script src="../JavaScript/script.js"></script>
</body>
</html>
